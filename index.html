            background: #000;
        }
        .video-wrap video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;

        }
        .info { padding: 24px 28px; }
        .info h3 { font-size: 20px; margin-bottom: 10px; font-weight: 600; }
        .info p { color: #a0a0a0; font-size: 14px; line-height: 1.6; }
        .tag {
